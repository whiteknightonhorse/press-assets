<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
<rect width="1200" height="510" fill="#ffffff"/>
<text x="60" y="56" font-size="30" font-weight="bold" fill="#1a1a1a">The L0 to L5 autonomy ladder, per operation</text>
<rect x="60" y="100" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="78" y="134" font-size="22" font-weight="bold" fill="#009E73">1</text><text x="112" y="136" font-size="22" fill="#1a1a1a">L0: a human does it</text><line x1="366" y1="165" x2="436" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,165 432,157 432,173" fill="#1a1a1a"/><rect x="450" y="100" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="468" y="134" font-size="22" font-weight="bold" fill="#009E73">2</text><text x="502" y="136" font-size="22" fill="#1a1a1a">L1: a human with tool</text><text x="502" y="165" font-size="22" fill="#1a1a1a">help</text><line x1="756" y1="165" x2="826" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="836,165 822,157 822,173" fill="#1a1a1a"/><rect x="840" y="100" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="858" y="134" font-size="22" font-weight="bold" fill="#009E73">3</text><text x="892" y="136" font-size="22" fill="#1a1a1a">L2: the agent proposes,</text><text x="892" y="165" font-size="22" fill="#1a1a1a">a human decides</text><polyline points="990,230 990,260 210,260 210,286" fill="none" stroke="#1a1a1a" stroke-width="3"/><polygon points="210,290 202,276 218,276" fill="#1a1a1a"/><rect x="60" y="290" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="78" y="324" font-size="22" font-weight="bold" fill="#009E73">4</text><text x="112" y="326" font-size="22" fill="#1a1a1a">L3: the agent acts, a</text><text x="112" y="355" font-size="22" fill="#1a1a1a">human approves</text><line x1="366" y1="355" x2="436" y2="355" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,355 432,347 432,363" fill="#1a1a1a"/><rect x="450" y="290" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="468" y="324" font-size="22" font-weight="bold" fill="#009E73">5</text><text x="502" y="326" font-size="22" fill="#1a1a1a">L4: the agent acts, a</text><text x="502" y="355" font-size="22" fill="#1a1a1a">human can intervene</text><line x1="756" y1="355" x2="826" y2="355" stroke="#1a1a1a" stroke-width="3"/><polygon points="836,355 822,347 822,363" fill="#1a1a1a"/><rect x="840" y="290" width="300" height="130" rx="10" fill="#f4f6f8" stroke="#009E73" stroke-width="3"/><text x="858" y="324" font-size="22" font-weight="bold" fill="#009E73">6</text><text x="892" y="326" font-size="22" fill="#1a1a1a">L5: no human control</text><text x="892" y="355" font-size="22" fill="#1a1a1a">path</text>
</svg>