<text x="60" y="56" font-size="30" font-weight="bold" fill="#1a1a1a">How an agent discovers a site</text>
<rect x="60" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#CC79A7" stroke-width="3"/><text x="78" y="134" font-size="22" font-weight="bold" fill="#CC79A7">1</text><text x="112" y="134" font-size="20" fill="#1a1a1a">Agent reads</text><text x="112" y="160" font-size="20" fill="#1a1a1a">robots.txt</text><line x1="386" y1="165" x2="436" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,165 432,157 432,173" fill="#1a1a1a"/><rect x="450" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#CC79A7" stroke-width="3"/><text x="468" y="134" font-size="22" font-weight="bold" fill="#CC79A7">2</text><text x="502" y="134" font-size="20" fill="#1a1a1a">Agent reads</text><text x="502" y="160" font-size="20" fill="#1a1a1a">llms.txt</text><line x1="776" y1="165" x2="826" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="836,165 822,157 822,173" fill="#1a1a1a"/><rect x="840" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#CC79A7" stroke-width="3"/><text x="858" y="134" font-size="22" font-weight="bold" fill="#CC79A7">3</text><text x="892" y="134" font-size="20" fill="#1a1a1a">Agent finds the</text><text x="892" y="160" font-size="20" fill="#1a1a1a">sitemap and agent</text><text x="892" y="186" font-size="20" fill="#1a1a1a">skills</text><polyline points="1000,230 1000,260 220,260 220,286" fill="none" stroke="#1a1a1a" stroke-width="3"/><polygon points="220,290 212,276 228,276" fill="#1a1a1a"/><rect x="60" y="290" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#CC79A7" stroke-width="3"/><text x="78" y="324" font-size="22" font-weight="bold" fill="#CC79A7">4</text><text x="112" y="324" font-size="20" fill="#1a1a1a">Agent picks the</text><text x="112" y="350" font-size="20" fill="#1a1a1a">pages it needs</text>
