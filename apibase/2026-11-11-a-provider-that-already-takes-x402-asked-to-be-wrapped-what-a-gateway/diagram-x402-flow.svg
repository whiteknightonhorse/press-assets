<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
<rect width="1200" height="510" fill="#ffffff"/>
<text x="60" y="56" font-size="30" font-weight="bold" fill="#1a1a1a">Paying for an API call over x402</text>
<rect x="60" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#0072B2" stroke-width="3"/><text x="78" y="134" font-size="22" font-weight="bold" fill="#0072B2">1</text><text x="112" y="134" font-size="20" fill="#1a1a1a">Agent calls the API</text><line x1="386" y1="165" x2="436" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,165 432,157 432,173" fill="#1a1a1a"/><rect x="450" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#0072B2" stroke-width="3"/><text x="468" y="134" font-size="22" font-weight="bold" fill="#0072B2">2</text><text x="502" y="134" font-size="20" fill="#1a1a1a">Server answers 402</text><text x="502" y="160" font-size="20" fill="#1a1a1a">with a price</text><line x1="776" y1="165" x2="826" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="836,165 822,157 822,173" fill="#1a1a1a"/><rect x="840" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#0072B2" stroke-width="3"/><text x="858" y="134" font-size="22" font-weight="bold" fill="#0072B2">3</text><text x="892" y="134" font-size="20" fill="#1a1a1a">Agent signs a</text><text x="892" y="160" font-size="20" fill="#1a1a1a">payment</text><polyline points="1000,230 1000,260 220,260 220,286" fill="none" stroke="#1a1a1a" stroke-width="3"/><polygon points="220,290 212,276 228,276" fill="#1a1a1a"/><rect x="60" y="290" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#0072B2" stroke-width="3"/><text x="78" y="324" font-size="22" font-weight="bold" fill="#0072B2">4</text><text x="112" y="324" font-size="20" fill="#1a1a1a">Agent retries with</text><text x="112" y="350" font-size="20" fill="#1a1a1a">the signed payment</text><line x1="386" y1="355" x2="436" y2="355" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,355 432,347 432,363" fill="#1a1a1a"/><rect x="450" y="290" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#0072B2" stroke-width="3"/><text x="468" y="324" font-size="22" font-weight="bold" fill="#0072B2">5</text><text x="502" y="324" font-size="20" fill="#1a1a1a">Server returns the</text><text x="502" y="350" font-size="20" fill="#1a1a1a">result and a</text><text x="502" y="376" font-size="20" fill="#1a1a1a">receipt</text>
</svg>