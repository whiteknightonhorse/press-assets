<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
<rect width="1200" height="320" fill="#ffffff"/>
<text x="60" y="56" font-size="30" font-weight="bold" fill="#1a1a1a">From a seller listing to the catalogue</text>
<rect x="60" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#E69F00" stroke-width="3"/><text x="78" y="134" font-size="22" font-weight="bold" fill="#E69F00">1</text><text x="112" y="134" font-size="20" fill="#1a1a1a">Seller submits a</text><text x="112" y="160" font-size="20" fill="#1a1a1a">listing</text><line x1="386" y1="165" x2="436" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="446,165 432,157 432,173" fill="#1a1a1a"/><rect x="450" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#E69F00" stroke-width="3"/><text x="468" y="134" font-size="22" font-weight="bold" fill="#E69F00">2</text><text x="502" y="134" font-size="20" fill="#1a1a1a">The listing is</text><text x="502" y="160" font-size="20" fill="#1a1a1a">reviewed</text><line x1="776" y1="165" x2="826" y2="165" stroke="#1a1a1a" stroke-width="3"/><polygon points="836,165 822,157 822,173" fill="#1a1a1a"/><rect x="840" y="100" width="320" height="130" rx="10" fill="#f4f6f8" stroke="#E69F00" stroke-width="3"/><text x="858" y="134" font-size="22" font-weight="bold" fill="#E69F00">3</text><text x="892" y="134" font-size="20" fill="#1a1a1a">A listing that</text><text x="892" y="160" font-size="20" fill="#1a1a1a">passes review joins</text><text x="892" y="186" font-size="20" fill="#1a1a1a">the catalogue</text>
</svg>